name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: support360_test
          POSTGRES_USER: support360
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support360 -d support360_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUPPORT360_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=support360_test;Username=support360;Password=ci-test-password;Pooling=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Support360.slnx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Support360.Agent/Support360.Agent.csproj -c Release
      - run: dotnet test tests/Support360.Tests.Agent/Support360.Tests.Agent.csproj
      - run: dotnet publish src/Support360.Agent/Support360.Agent.csproj -c Release -r linux-x64 --self-contained false -o /tmp/agent-linux
      - run: dotnet publish src/Support360.Agent/Support360.Agent.csproj -c Release -r win-x64 --self-contained false -o /tmp/agent-windows
      - run: test -x /tmp/agent-linux/support360-agent && test -f /tmp/agent-windows/support360-agent.exe
